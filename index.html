<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CWLABS — Portfolio Builder</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta name="description" content="CWLABS Portfolio Builder — choose from 17 art-directed portfolio templates and publish your cybersecurity portfolio.">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="cw-skip" href="#cw-main">Skip to content</a>

  <header class="cw-topbar">
    <div class="cw-topbar__left">
      <span class="cw-logo" aria-hidden="true">CW</span>
      <div>
        <strong class="cw-logo-name">CWLABS</strong>
        <span class="cw-logo-sub">Portfolio Builder</span>
      </div>
    </div>
    <div class="cw-topbar__right">
      <div class="cw-status" id="cw-status" role="status" aria-live="polite">Draft saved</div>
      <button class="cw-btn cw-btn--ghost" id="cw-reset" type="button">Reset data</button>
      <button class="cw-btn cw-btn--ghost" id="cw-unpublish" type="button">Unpublish</button>
      <button class="cw-btn cw-btn--solid" id="cw-publish" type="button">Publish</button>
    </div>
  </header>

  <main class="cw-app" id="cw-main">
    <!-- Template selector -->
    <section class="cw-panel cw-panel--templates" aria-labelledby="cw-templates-h">
      <div class="cw-panel__head">
        <h2 id="cw-templates-h">Templates</h2>
        <div class="cw-filter" role="group" aria-label="Filter templates">
          <button type="button" class="cw-chip is-active" data-filter="all">All <span>26</span></button>
          <button type="button" class="cw-chip" data-filter="Cyber">Cyber <span>4</span></button>
          <button type="button" class="cw-chip" data-filter="Animated">Animated <span>5</span></button>
          <button type="button" class="cw-chip" data-filter="New">New <span>10</span></button>
          <button type="button" class="cw-chip" data-filter="Classic">Classic <span>7</span></button>
        </div>
      </div>
      <div class="cw-templates" id="cw-templates" role="listbox" aria-label="Available templates"></div>
    </section>

    <!-- Editor -->
    <section class="cw-panel cw-panel--editor" aria-labelledby="cw-editor-h">
      <div class="cw-panel__head">
        <h2 id="cw-editor-h">Content</h2>
        <p class="cw-hint">Changes update the preview instantly. Everything is stored against your portfolio record.</p>
      </div>
      <div id="cw-editor" class="cw-editor"></div>
    </section>

    <!-- Preview -->
    <section class="cw-panel cw-panel--preview" aria-labelledby="cw-preview-h">
      <div class="cw-panel__head cw-panel__head--preview">
        <h2 id="cw-preview-h">Live preview</h2>
        <div class="cw-viewport" role="group" aria-label="Preview viewport">
          <button type="button" class="cw-chip is-active" data-view="desktop" aria-pressed="true">Desktop</button>
          <button type="button" class="cw-chip" data-view="tablet" aria-pressed="false">Tablet</button>
          <button type="button" class="cw-chip" data-view="mobile" aria-pressed="false">Mobile</button>
          <button type="button" class="cw-chip" id="cw-open-tab">Open full page</button>
        </div>
      </div>
      <div class="cw-frame-wrap" id="cw-frame-wrap">
        <iframe id="cw-preview" class="cw-frame" title="Portfolio preview" loading="lazy"></iframe>
      </div>
      <p class="cw-pub" id="cw-pub"></p>
    </section>
  </main>

  <!-- Core runtime -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/anim.js"></script>
  <script src="assets/js/adapter.js"></script>
  <script src="assets/js/registry.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/sample-data.js"></script>
  <script src="assets/js/renderer.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
